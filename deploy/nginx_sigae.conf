# ==============================================================================
# CONFIGURACIÓN DE PROXY INVERSO NGINX — EVENTOSSIGAE-UNIMINUTO
# Archivo: /etc/nginx/sites-available/sigae
# NOTA INSTITUCIONAL:
# 'eventos.uniminuto.edu.co' es un nombre de dominio de ejemplo PENDIENTE de asignación
# y aprobación por la Dirección de Tecnología (TI) de UNIMINUTO. Reemplazar por el FQDN oficial.
# ==============================================================================

# Redirección obligatoria HTTP (Puerto 80) hacia HTTPS (Puerto 443)
server {
    listen 80;
    listen [::]:80;
    server_name eventos.uniminuto.edu.co;

    # Permitir desafío ACME de Certbot / Let's Encrypt antes de habilitar SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor seguro HTTPS (Puerto 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eventos.uniminuto.edu.co;

    # Certificados SSL/TLS institucionales
    ssl_certificate /etc/letsencrypt/live/eventos.uniminuto.edu.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eventos.uniminuto.edu.co/privkey.pem;

    # Parámetros y protocolos criptográficos modernos (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeceras de seguridad perimetral (Defensa en profundidad)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ADVERTENCIA HSTS: No habilitar HSTS de 1 año (31536000) ni preload en la puesta en marcha inicial.
    # Se recomienda iniciar con max-age=300 (5 minutos) y solo activar 31536000 tras certificar estabilidad TLS.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Strict-Transport-Security "max-age=300" always;

    # Límite máximo de carga de archivos (Mitiga ataques DoS por cargas masivas)
    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # ARCHIVOS ESTÁTICOS DE PRODUCCIÓN (/static/)
    # --------------------------------------------------------------------------
    location /static/ {
        alias /var/www/sigae-uniminuto/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # ARCHIVOS DE MEDIOS Y SUBIDAS DE USUARIOS (/media/)
    # TRATAMIENTO DE MÁXIMA SEGURIDAD: PROHIBICIÓN TOTAL DE EJECUCIÓN DE SCRIPTS
    # --------------------------------------------------------------------------
    location /media/ {
        alias /var/www/sigae-uniminuto/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;

        # Bloqueo estricto contra inyección y ejecución de código remoto (RCE) (RNF-01, RNF-02)
        location ~* \.(php|pl|py|jsp|asp|sh|cgi|exe|bat|cmd|dll|bin|phar|phtml)$ {
            deny all;
            return 403;
        }
    }

    # --------------------------------------------------------------------------
    # ENLACE AL SERVIDOR DE APLICACIONES GUNICORN (PROXY INVERSO)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        # Para socket UNIX (mayor rendimiento en Linux):
        # proxy_pass http://unix:/run/gunicorn/sigae.sock;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Endpoint de monitoreo de salud perimetral (Balanceadores / Uptime)
    location = /health/ {
        proxy_pass http://127.0.0.1:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
}
