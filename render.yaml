services:
  - type: web
    name: eventossigae-uniminuto
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: RENDER
        value: "true"
      - key: USE_X_FORWARDED_PROTO
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: SIGAE UNIMINUTO <no-reply@uniminuto.edu.co>

